<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Sentinel Watch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#dae2fd",
                        "on-primary-fixed-variant": "#004881",
                        "inverse-primary": "#0060a8",
                        "on-tertiary": "#003912",
                        "inverse-on-surface": "#283044",
                        "background": "#0b1326",
                        "outline": "#8e9196",
                        "tertiary-container": "#002007",
                        "surface-bright": "#31394d",
                        "on-primary-container": "#1885e2",
                        "surface-container-high": "#222a3d",
                        "primary-fixed": "#d3e4ff",
                        "surface-variant": "#2d3449",
                        "on-secondary-fixed-variant": "#304a55",
                        "error": "#ffb4ab",
                        "on-background": "#dae2fd",
                        "on-tertiary-fixed-variant": "#00531e",
                        "on-error": "#690005",
                        "secondary-fixed": "#cbe7f5",
                        "on-primary-fixed": "#001c38",
                        "surface-container-lowest": "#060e20",
                        "tertiary-fixed-dim": "#3ce36a",
                        "surface-tint": "#a2c9ff",
                        "surface-container-low": "#131b2e",
                        "on-primary": "#00315b",
                        "on-tertiary-fixed": "#002108",
                        "tertiary-fixed": "#69ff87",
                        "on-secondary": "#19343e",
                        "surface-container": "#171f33",
                        "primary-fixed-dim": "#a2c9ff",
                        "primary-container": "#001b35",
                        "on-tertiary-container": "#00973d",
                        "outline-variant": "#44474c",
                        "tertiary": "#3ce36a",
                        "on-surface-variant": "#c4c6cc",
                        "secondary": "#afcbd8",
                        "surface-dim": "#0b1326",
                        "secondary-fixed-dim": "#afcbd8",
                        "on-secondary-fixed": "#021f29",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#2d3449",
                        "secondary-container": "#334d58",
                        "error-container": "#93000a",
                        "on-secondary-container": "#a1bdca",
                        "primary": "#a2c9ff",
                        "inverse-surface": "#dae2fd",
                        "surface": "#0b1326"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #0b1326;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(45, 52, 73, 0.6);
            backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .gradient-button {
            background: linear-gradient(135deg, #a2c9ff 0%, #1885e2 100%);
        }
        .gradient-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .network-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(162, 201, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,72,129,0.3);
            border-top-color: #004881;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .error-msg {
            color: #ffb4ab;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: rgba(147, 0, 10, 0.15);
            border: 1px solid rgba(255, 180, 171, 0.15);
            border-radius: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.3s ease;
        }
        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 19, 38, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .success-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        @keyframes checkmark {
            0% { stroke-dashoffset: 50; }
            100% { stroke-dashoffset: 0; }
        }
        .checkmark-circle {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: checkmark 0.6s ease forwards 0.2s;
        }
        .checkmark-check {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: checkmark 0.4s ease forwards 0.6s;
        }
        .input-error {
            box-shadow: 0 0 0 1px rgba(255, 180, 171, 0.5) !important;
        }
    </style>
</head>
<body class="text-on-surface selection:bg-primary/30 selection:text-primary min-h-screen flex items-center justify-center overflow-hidden">
<!-- Background Network Graphic -->
<div class="fixed inset-0 network-pattern pointer-events-none"></div>
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-on-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-6">
<!-- Branding Anchor -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-surface-container-high rounded-xl flex items-center justify-center mb-6 border border-outline-variant/15">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="shield_with_heart" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface">Sentinel Watch</h1>
<p class="font-body text-on-surface-variant mt-2 text-sm">Advanced Infrastructure Intelligence</p>
</div>
<!-- Surface Layer 1: Recessed Background for Depth -->
<div class="bg-surface-container-low rounded-xl p-1">
<!-- Surface Layer 2: Glass Card -->
<div class="glass-panel border border-outline-variant/15 rounded-xl p-8 shadow-2xl">
<form id="loginForm" class="space-y-6" novalidate>
<!-- Error Message -->
<div id="errorMsg" class="error-msg">
<span class="material-symbols-outlined text-sm">error</span>
<span id="errorText">Invalid credentials</span>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-[0.1em] font-bold text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg transition-colors group-focus-within:text-primary" data-icon="alternate_email">alternate_email</span>
</div>
<input class="w-full bg-surface-container-lowest border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-1 focus:ring-primary/50 transition-all font-body" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-[10px] uppercase tracking-[0.1em] font-bold text-on-surface-variant" for="password">Password</label>
<a class="font-label text-xs font-semibold text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg transition-colors group-focus-within:text-primary" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-none rounded-lg py-4 pl-12 pr-12 text-on-surface placeholder:text-outline/50 focus:ring-1 focus:ring-primary/50 transition-all font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span id="toggleIcon" class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button id="submitBtn" class="gradient-button w-full py-4 px-6 rounded-lg font-headline font-bold text-on-primary-fixed shadow-[0_0_20px_rgba(162,201,255,0.2)] hover:shadow-[0_0_30px_rgba(162,201,255,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span id="btnText">Log In</span>
<span id="btnArrow" class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div id="btnSpinner" class="spinner" style="display:none;"></div>
</button>
</div>
</form>
<!-- Security Footer -->
<div class="mt-8 pt-6 border-t border-outline-variant/10 flex items-center justify-center gap-4 opacity-60">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]" data-icon="verified_user">verified_user</span>
<span class="text-[10px] font-label uppercase tracking-widest">End-to-End Encryption</span>
</div>
<div class="w-1 h-1 bg-outline-variant rounded-full"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]" data-icon="token">token</span>
<span class="text-[10px] font-label uppercase tracking-widest">MFA Support</span>
</div>
</div>
</div>
</div>
<!-- Legal/Auxiliary Links -->
<footer class="mt-8 flex justify-center gap-6 text-[11px] font-label text-on-surface-variant/60 uppercase tracking-[0.15em]">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Security Center</a>
<a class="hover:text-primary transition-colors" href="#">Contact Support</a>
</footer>
</main>

<!-- Success Overlay -->
<div id="successOverlay" class="success-overlay">
<svg width="80" height="80" viewBox="0 0 80 80">
<circle class="checkmark-circle" cx="40" cy="40" r="36" fill="none" stroke="#3ce36a" stroke-width="3"/>
<path class="checkmark-check" d="M24 42 L34 52 L56 30" fill="none" stroke="#3ce36a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<p class="font-headline text-tertiary text-xl font-bold mt-6">Access Granted</p>
<p class="text-slate-400 text-sm mt-2">Redirecting to dashboard...</p>
</div>

<script>
(function() {
    // ===== AUTH CONFIG =====
    // Credenciais válidas (simuladas - em produção seria um backend)
    const VALID_USERS = [
        { email: 'admin@sentinel.com', password: 'sentinel123', name: 'Admin User', role: 'System Architect' },
        { email: 'user@sentinel.com', password: 'user123', name: 'Operator', role: 'Network Operator' }
    ];

    // Se já está logado, redirecionar pro dashboard
    const session = localStorage.getItem('sentinel_session');
    if (session) {
        try {
            const parsed = JSON.parse(session);
            if (parsed.authenticated) {
                window.location.href = '../dashboard/dashboard.html';
                return;
            }
        } catch(e) {
            localStorage.removeItem('sentinel_session');
        }
    }

    // ===== DOM ELEMENTS =====
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnArrow = document.getElementById('btnArrow');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const successOverlay = document.getElementById('successOverlay');

    // ===== PASSWORD VISIBILITY TOGGLE =====
    toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    // ===== CLEAR ERRORS ON INPUT =====
    emailInput.addEventListener('input', clearErrors);
    passwordInput.addEventListener('input', clearErrors);

    function clearErrors() {
        errorMsg.classList.remove('visible');
        emailInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');
    }

    function showError(message) {
        errorText.textContent = message;
        errorMsg.classList.add('visible');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
    }

    function setLoading(loading) {
        submitBtn.disabled = loading;
        btnText.textContent = loading ? 'Authenticating...' : 'Log In';
        btnArrow.style.display = loading ? 'none' : '';
        btnSpinner.style.display = loading ? 'block' : 'none';
    }

    // ===== FORM SUBMIT =====
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Validação de campos vazios
        if (!email && !password) {
            showError('Please fill in all fields.');
            emailInput.classList.add('input-error');
            passwordInput.classList.add('input-error');
            emailInput.focus();
            return;
        }

        if (!email) {
            showError('Please enter your email address.');
            emailInput.classList.add('input-error');
            emailInput.focus();
            return;
        }

        // Validação de formato de email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showError('Please enter a valid email address.');
            emailInput.classList.add('input-error');
            emailInput.focus();
            return;
        }

        if (!password) {
            showError('Please enter your password.');
            passwordInput.classList.add('input-error');
            passwordInput.focus();
            return;
        }

        if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            passwordInput.classList.add('input-error');
            passwordInput.focus();
            return;
        }

        // Iniciar loading
        setLoading(true);

        // Simular delay de autenticação (como se fosse uma API)
        setTimeout(function() {
            const user = VALID_USERS.find(u => u.email === email && u.password === password);

            if (user) {
                // ===== LOGIN SUCESSO =====
                const sessionData = {
                    authenticated: true,
                    email: user.email,
                    name: user.name,
                    role: user.role,
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('sentinel_session', JSON.stringify(sessionData));

                // Mostrar overlay de sucesso
                successOverlay.classList.add('visible');

                // Redirecionar após animação
                setTimeout(function() {
                    window.location.href = '../dashboard/dashboard.html';
                }, 1800);
            } else {
                // ===== LOGIN FALHOU =====
                setLoading(false);

                // Verificar se o email existe
                const emailExists = VALID_USERS.find(u => u.email === email);
                if (emailExists) {
                    showError('Incorrect password. Please try again.');
                    passwordInput.classList.add('input-error');
                    passwordInput.focus();
                    passwordInput.select();
                } else {
                    showError('No account found with this email.');
                    emailInput.classList.add('input-error');
                    emailInput.focus();
                }
            }
        }, 1500);
    });

    // ===== ENTER KEY SUPPORT =====
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            form.dispatchEvent(new Event('submit'));
        }
    });
})();
</script>
</body></html>
